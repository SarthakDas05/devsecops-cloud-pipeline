name: CI - Pull Request Verification & Security Gates

on:
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Quality, SAST & Unit Tests
  # ============================================================================
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check app/

      - name: Python SAST Scan with Bandit
        run: |
          bandit -r app/ -ll -ii

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing app/tests/

  # ============================================================================
  # 2. Shift-Left Security Scans (Secrets & Dockerfile)
  # ============================================================================
  security-scans:
    name: Secrets & Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Leaked Secrets with Secretlint
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

  # ============================================================================
  # 3. Container Build, CVE Vulnerability Scan & SBOM Generation
  # ============================================================================
  container-security:
    name: Container CVE Gate & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: devsecops-microservice:${{ github.sha }}

      - name: Scan Container for CVEs with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-microservice:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-microservice:${{ github.sha }}'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom-cyclonedx.json

  # ============================================================================
  # 4. Terraform Validation
  # ============================================================================
  terraform-validate:
    name: Terraform Format & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
